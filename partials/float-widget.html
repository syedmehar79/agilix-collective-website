<aside class="float-dock" aria-label="Live info dock">
    <div class="float-dock__clock" aria-live="polite">
        <span class="float-dock__time" id="float-dock-time">1 <span class="float-dock__unit">Year</span></span>
        <span class="float-dock__datetime" id="float-dock-datetime">in market</span>
    </div>

    <div class="float-dock__divider" aria-hidden="true"></div>

    <button type="button" class="float-dock__theme" id="float-dock-theme" aria-label="Switch to dark theme" aria-pressed="false" title="Toggle light / dark theme">
        <svg class="float-dock__theme-icon float-dock__theme-icon--sun" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.75"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.05 5.05l1.56 1.56M17.39 17.39l1.56 1.56M5.05 18.95l1.56-1.56M17.39 6.61l1.56-1.56" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        <svg class="float-dock__theme-icon float-dock__theme-icon--moon" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M19.5 13.2A7.5 7.5 0 0 1 10.8 4.5 7.6 7.6 0 1 0 19.5 13.2Z" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <div class="float-dock__divider" aria-hidden="true"></div>

    <div class="float-dock__products" role="list">
        <a class="float-dock__product" role="listitem" href="https://trace.agilixcollective.com" target="_blank" rel="noopener noreferrer" aria-label="Trace — unified workspace">
            <img class="float-dock__product-icon float-dock__product-icon--trace" src="assets/icons/trace-favicon.png" alt="" width="28" height="28" decoding="async">
        </a>
        <a class="float-dock__product" role="listitem" href="products.html" aria-label="Products">
            <svg class="float-dock__product-icon float-dock__product-icon--app" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="4.25" y="4.25" width="15.5" height="15.5" rx="4" stroke="currentColor" stroke-width="1.75"/>
            </svg>
        </a>
        <a class="float-dock__product" role="listitem" href="services.html" aria-label="Services">
            <svg class="float-dock__product-icon float-dock__product-icon--app" width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="4.25" y="4.25" width="15.5" height="15.5" rx="4" stroke="currentColor" stroke-width="1.75"/>
            </svg>
        </a>
    </div>

    <div class="float-dock__divider" aria-hidden="true"></div>

    <div class="float-dock__cta-group">
        <a class="float-dock__cta" href="#contact" data-open-modal="contact">get in touch</a>
        <a class="float-dock__cta float-dock__cta--secondary" href="careers.html" data-open-modal="careers">join us</a>
    </div>
</aside>

<div class="form-modal form-modal--contact" id="contact-modal" hidden aria-hidden="true">
    <div class="form-modal__backdrop" data-close-modal tabindex="-1"></div>
    <div class="form-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="contact-modal-title">
        <button type="button" class="form-modal__close" data-close-modal aria-label="Close get in touch form">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <div class="form-modal__header">
            <p class="footer-eyebrow">GET IN TOUCH</p>
            <h2 id="contact-modal-title" class="form-modal__title form-modal__title--contact">let's build something together</h2>
        </div>
        <form class="footer-form" action="https://formsubmit.co/mehar.ali@agilixcollective.com" method="POST" novalidate>
            <input type="hidden" name="_subject" value="New enquiry from Agilix Collective website">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" value="" tabindex="-1" autocomplete="off" class="footer-honey" aria-hidden="true">
            <div class="footer-form-grid">
                <div class="footer-field">
                    <label class="footer-label" for="modal-footer-name">full name*</label>
                    <input id="modal-footer-name" name="full_name" type="text" autocomplete="name" placeholder="John Doe" required data-modal-focus>
                </div>
                <div class="footer-field">
                    <label class="footer-label" for="modal-footer-email">email*</label>
                    <input id="modal-footer-email" name="email" type="email" autocomplete="email" placeholder="john@company.com" required>
                </div>
                <div class="footer-field">
                    <label class="footer-label" for="modal-footer-phone">phone number*</label>
                    <input id="modal-footer-phone" name="phone" type="tel" autocomplete="tel" placeholder="+1 555 000 0000" required>
                </div>
                <div class="footer-field">
                    <label class="footer-label" for="modal-footer-company">company name*</label>
                    <input id="modal-footer-company" name="company_name" type="text" autocomplete="organization" placeholder="Company Inc." required>
                </div>
                <div class="footer-field">
                    <label class="footer-label" for="modal-footer-company-url">company url</label>
                    <input id="modal-footer-company-url" name="company_url" type="url" autocomplete="url" placeholder="https://company.com">
                </div>
                <div class="footer-field">
                    <label class="footer-label" for="modal-footer-region">region*</label>
                    <select id="modal-footer-region" name="region" required>
                        <option value="" disabled selected>Select Region</option>
                        <option value="Middle East &amp; North Africa">Middle East &amp; North Africa</option>
                        <option value="USA">USA</option>
                        <option value="Canada">Canada</option>
                        <option value="Kingdom of Saudi Arabia">Kingdom of Saudi Arabia</option>
                        <option value="Australia &amp; New Zealand">Australia &amp; New Zealand</option>
                        <option value="Asia">Asia</option>
                        <option value="Europe">Europe</option>
                        <option value="Rest of World">Rest of World</option>
                    </select>
                </div>
                <div class="footer-field footer-field--full">
                    <label class="footer-label" for="modal-footer-services">services you are looking for*</label>
                    <select id="modal-footer-services" name="services" required>
                        <option value="" disabled selected>Select a service</option>
                        <option value="Remote IT Resources">Remote IT Resources</option>
                        <option value="Custom Software Development">Custom Software Development</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Mobile App Development">Mobile App Development</option>
                        <option value="AR/VR">AR/VR</option>
                        <option value="Gaming">Gaming</option>
                        <option value="Cyber Security">Cyber Security</option>
                        <option value="Other IT Services">Other IT Services</option>
                    </select>
                </div>
                <div class="footer-field footer-field--full">
                    <label class="footer-label" for="modal-footer-details">project details*</label>
                    <textarea id="modal-footer-details" name="project_details" rows="4" placeholder="Tell us about your project, goals, and timeline" required></textarea>
                </div>
                <div class="footer-field footer-field--full footer-consent">
                    <label class="footer-consent-label" for="modal-footer-marketing">
                        <input id="modal-footer-marketing" name="marketing_email_consent" type="checkbox" value="Yes">
                        <span>I agree to receive marketing information and updates via email.</span>
                    </label>
                </div>
                <div class="footer-field footer-field--full footer-consent">
                    <label class="footer-consent-label" for="modal-footer-sms">
                        <input id="modal-footer-sms" name="sms_consent" type="checkbox" value="Yes">
                        <span>I agree to receive SMS messages from agilix collective. Reply ‘STOP’ to opt out anytime.</span>
                    </label>
                </div>
            </div>
            <button class="footer-form-button" type="submit">submit</button>
        </form>
    </div>
</div>

<div class="form-modal form-modal--careers" id="careers-modal" hidden aria-hidden="true">
    <div class="form-modal__backdrop" data-close-modal tabindex="-1"></div>
    <div class="form-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="careers-modal-title">
        <button type="button" class="form-modal__close" data-close-modal aria-label="Close join us form">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <div class="form-modal__header">
            <p class="section-label career-label">CAREERS</p>
            <h2 id="careers-modal-title" class="form-modal__title form-modal__title--careers">join our team</h2>
            <p class="career-lead form-modal__lead">Share your profile and we’ll reach out when there’s a fit.</p>
        </div>
        <form class="career-form" action="https://formsubmit.co/mehar.ali@agilixcollective.com" method="POST" enctype="multipart/form-data" novalidate>
            <input type="hidden" name="_subject" value="New career application — Agilix Collective">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <input type="text" name="_honey" value="" tabindex="-1" autocomplete="off" class="footer-honey" aria-hidden="true">
            <div class="career-form-grid">
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-name">full name*</label>
                    <input id="modal-career-name" name="full_name" type="text" autocomplete="name" placeholder="John Doe" required data-modal-focus>
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-email">email*</label>
                    <input id="modal-career-email" name="email" type="email" autocomplete="email" placeholder="john@email.com" required>
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-city">city*</label>
                    <select id="modal-career-city" name="city" required>
                        <option value="" disabled selected>Select city</option>
                        <option value="Lahore">Lahore</option>
                        <option value="Karachi">Karachi</option>
                        <option value="Islamabad">Islamabad</option>
                        <option value="Rawalpindi">Rawalpindi</option>
                        <option value="Faisalabad">Faisalabad</option>
                        <option value="Multan">Multan</option>
                        <option value="Peshawar">Peshawar</option>
                        <option value="Quetta">Quetta</option>
                        <option value="Remote">Remote</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-position">position*</label>
                    <select id="modal-career-position" name="position" required>
                        <option value="" disabled selected>Select position</option>
                        <option value="Software Engineer">Software Engineer</option>
                        <option value="Frontend Developer">Frontend Developer</option>
                        <option value="Backend Developer">Backend Developer</option>
                        <option value="Full Stack Developer">Full Stack Developer</option>
                        <option value="UI/UX Designer">UI/UX Designer</option>
                        <option value="Product Manager">Product Manager</option>
                        <option value="Project Manager">Project Manager</option>
                        <option value="QA Engineer">QA Engineer</option>
                        <option value="DevOps Engineer">DevOps Engineer</option>
                        <option value="Intern">Intern</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-experience">total experience*</label>
                    <select id="modal-career-experience" name="total_experience" required>
                        <option value="" disabled selected>Select experience</option>
                        <option value="Fresher / Less than 1 year">Fresher / Less than 1 year</option>
                        <option value="1–2 years">1–2 years</option>
                        <option value="2–4 years">2–4 years</option>
                        <option value="4–6 years">4–6 years</option>
                        <option value="6–10 years">6–10 years</option>
                        <option value="10+ years">10+ years</option>
                    </select>
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-degree">last degree*</label>
                    <select id="modal-career-degree" name="last_degree" required>
                        <option value="" disabled selected>Select degree</option>
                        <option value="Intermediate / High School">Intermediate / High School</option>
                        <option value="Diploma">Diploma</option>
                        <option value="BS Computer Science">BS Computer Science</option>
                        <option value="BS Software Engineering">BS Software Engineering</option>
                        <option value="BS Information Technology">BS Information Technology</option>
                        <option value="Bachelor of Engineering">Bachelor of Engineering</option>
                        <option value="BBA">BBA</option>
                        <option value="MS / MPhil">MS / MPhil</option>
                        <option value="MBA">MBA</option>
                        <option value="PhD">PhD</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-organization">current organization</label>
                    <input id="modal-career-organization" name="current_organization" type="text" autocomplete="organization" placeholder="Company name">
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-current-salary">current salary</label>
                    <div class="career-salary">
                        <span class="career-salary-currency" aria-hidden="true">PKR</span>
                        <input type="hidden" name="current_salary_currency" value="PKR">
                        <input id="modal-career-current-salary" name="current_salary" type="number" inputmode="numeric" min="0" step="1000" placeholder="150000">
                    </div>
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-expected-salary">expected salary*</label>
                    <div class="career-salary">
                        <span class="career-salary-currency" aria-hidden="true">PKR</span>
                        <input type="hidden" name="expected_salary_currency" value="PKR">
                        <input id="modal-career-expected-salary" name="expected_salary" type="number" inputmode="numeric" min="0" step="1000" placeholder="200000" required>
                    </div>
                </div>
                <div class="career-field">
                    <label class="career-label-field" for="modal-career-linkedin">linkedin url</label>
                    <input id="modal-career-linkedin" name="linkedin_url" type="url" autocomplete="url" placeholder="https://linkedin.com/in/username">
                </div>
                <div class="career-field career-field--full">
                    <label class="career-label-field" for="modal-career-resume">resume*</label>
                    <div class="career-upload">
                        <input id="modal-career-resume" class="career-upload-input" name="resume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
                        <label class="career-upload-btn" for="modal-career-resume">upload resume</label>
                        <span class="career-upload-name" id="modal-career-resume-name" aria-live="polite">PDF or DOC, max 5MB</span>
                        <button class="career-form-button" type="submit">submit</button>
                    </div>
                </div>
            </div>
            <p class="career-form-status" role="status" aria-live="polite"></p>
        </form>
    </div>
</div>
